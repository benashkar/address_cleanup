services:
  - type: web
    name: address-merge-review
    env: python
    region: ohio
    rootDir: webapp
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_PATH
        value: /tmp/review.db
      - key: MERGES_CSV
        value: ../reports/high_confidence_merges_20260130_001351.csv
      - key: PYTHON_VERSION
        value: 3.11.0
